name: probe5
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U pip requests
      - run: python probe5.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          mkdir -p out && git add -f out/probe5.json || true
          git commit -m "probe5: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
