name: discover-eng

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip requests
      - name: Discover
        run: python discover_eng.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add -f out/chan_dump.json out/eng_candidates.json || true
          git commit -m "discover: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
