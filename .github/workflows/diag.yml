name: diag-eng

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip requests
      - name: Diag
        run: python diag_eng.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add -f out/ || true
          git commit -m "diag: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
