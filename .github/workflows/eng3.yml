name: collect-eng3

on:
  workflow_dispatch:
    inputs:
      ids:
        description: '额外视频ID，逗号分隔'
        required: false
        default: 'vVvaP-L85VE,UhDxjaP6dtg,NZxktVxuYug'
      missing_ep:
        description: '待搜索的集号，逗号分隔'
        required: false
        default: '9,13,4'

permissions:
  contents: write

jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip requests
      - name: Collect
        env:
          IDS: ${{ github.event.inputs.ids }}
          MISSING_EP: ${{ github.event.inputs.missing_ep }}
        run: python collect_eng_final.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add -f out/raw_eng.jsonl || true
          git commit -m "eng3: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
