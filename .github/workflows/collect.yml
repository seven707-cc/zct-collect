name: collect-youtube-comments

# 在境外 runner 上跑，直连 youtube.com，不需要任何代理
on:
  workflow_dispatch:
    inputs:
      queries:
        description: '搜索关键词，用 | 分隔（留空使用默认中餐厅词表）'
        required: false
        default: ''
      video_ids:
        description: '指定视频ID，逗号分隔（填了就不搜索）'
        required: false
        default: ''
      max_comments:
        description: '每条视频最多抓多少条评论，0=全量'
        required: false
        default: '0'
      max_videos:
        description: '最多处理多少条视频，0=不限'
        required: false
        default: '0'
      sort:
        description: '评论排序 top 或 new'
        required: false
        default: 'top'
  schedule:
    # 每天 UTC 20:00（北京时间 04:00）自动增量跑一次
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: collect-yt
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: |
          python -m pip install -U pip
          python -m pip install -U yt-dlp
          yt-dlp --version

      - name: Verify egress can reach YouTube
        run: |
          yt-dlp --no-warnings --flat-playlist --skip-download \
            --print "%(id)s|%(title)s" "ytsearch1:test" || echo "egress check failed"

      - name: Collect comments
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
          MAX_COMMENTS: ${{ github.event.inputs.max_comments || '0' }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos || '0' }}
          SORT: ${{ github.event.inputs.sort || 'top' }}
          # 可选：仓库 Settings → Secrets 里加 YT_COOKIES，
          # 内容是 cookies.txt 全文或 base64。用于绕过 runner IP 的机器人校验。
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          # 可选：住宅代理，形如 http://user:pass@host:port
          # runner 在境外，国内买的海外住宅代理可以正常使用（不受大陆网络限制）。
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: python collect_yt.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-comments
          path: out/
          retention-days: 30

      # 把结果提交回仓库，这样国内直接在网页上就能下载 csv，
      # 不用登录 GitHub 去下 artifact。
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/ || true
          git commit -m "chore: collect youtube comments $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push || echo "push failed"
