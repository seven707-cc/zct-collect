name: collect-eng

on:
  workflow_dispatch:
    inputs:
      max_comments:
        description: '每条视频最多评论数，0=全量'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install -U pip requests

      - name: Collect EN
        env:
          MAX_COMMENTS: ${{ github.event.inputs.max_comments }}
        run: python yt_eng.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/ || true
          git commit -m "eng: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing"
          git push || echo "push failed"
