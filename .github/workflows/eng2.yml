name: collect-eng2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip requests
      - name: Collect
        run: python eng2.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add -f out/raw_eng.jsonl out/eng_videos.json || true
          git commit -m "eng2: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
