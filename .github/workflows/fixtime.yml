name: fix-time
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U pip requests
      - run: python fix_time.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@example.com"
          git add -f out/raw_eng.jsonl || true
          git commit -m "fixtime: $(date -u +%FT%TZ)" || echo nothing
          git push || echo fail
